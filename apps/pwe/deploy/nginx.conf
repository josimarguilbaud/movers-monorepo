server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Traefik (TLS terminado ahí): redirects relativos (no bajar a http).
    absolute_redirect off;

    # Redirige la raíz al idioma por defecto (español).
    location = / { return 301 /es/; }

    # ========================================================================
    # Migración WordPress -> Astro. Protege el SEO del sitio anterior.
    #
    # El WordPress que estaba en este dominio tenía 72 URLs en su sitemap
    # (revisado el 2026-08-17 en /wp-sitemap.xml). Casi todas eran contenido
    # de demostración de la plantilla "Jetly", de alquiler de jets privados,
    # que nada tiene que ver con mudanzas. La misma plantilla que hubo que
    # limpiar en PIM.
    #
    # Sin estas reglas, al publicar el sitio nuevo las pocas URLs con valor
    # devolverían 404 y se perdería lo que tuvieran acumulado, mientras la
    # basura seguiría indexada durante meses.
    # ========================================================================

    # --- 301: las que sí tienen equivalente real en el sitio nuevo ---
    location = /about-us/     { return 301 /es/nosotros/; }
    location = /contact-us/   { return 301 /es/contacto/; }
    location = /services/     { return 301 /es/servicios/; }
    location = /destinations/ { return 301 /es/destinos/; }
    location = /faqs/         { return 301 /es/recursos/; }
    location = /blog/         { return 301 /es/recursos/; }
    location = /news/         { return 301 /es/recursos/; }
    location = /team/         { return 301 /es/nosotros/; }
    location = /gallery/      { return 301 /es/nosotros/; }
    location = /testimonial/  { return 301 /es/nosotros/; }

    # El sitemap viejo apunta al nuevo, para que Google reencamine el rastreo.
    location = /wp-sitemap.xml { return 301 /sitemap-index.xml; }
    location = /sitemap.xml    { return 301 /sitemap-index.xml; }

    # --- 410 Gone: demo de la plantilla Jetly y restos de WordPress ---
    # 410 y no 404: le dice a Google que la URL se eliminó a propósito, y la
    # saca del índice mucho más rápido que un 404, que reintenta durante meses.
    location ~* ^/(category|tag|author|header|footer|megamenu|business-charter|private-charter|jet-rentals|music-tours|sports-teams|high-profile-people|home-one|home-two|home-three|home-four|home-rtl|onepage-|jetly-|few-reasons|flights-precautionary|destination-details|gallery-carousel|news-carousel|service-carousel|team-carousel|testimonials-carousel|sample-page|hello-world|tienda|carrito|finalizar-compra|mi-cuenta|lista-de-deseos|wishlist|producto|categoria-producto)(/|$) {
        return 410;
    }

    # Restos de la instalación de WordPress.
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|xmlrpc\.php|wp-login\.php)(/|$) {
        return 410;
    }

    # Assets con hash: caché inmutable de 1 año.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Páginas estáticas de Astro (carpeta/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
