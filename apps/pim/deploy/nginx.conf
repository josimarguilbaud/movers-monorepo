server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Traefik (TLS terminado ahí): emitir redirects RELATIVOS
    # para no degradar https:// a http:// en el Location.
    absolute_redirect off;

    # Redirige la raíz al idioma por defecto (español).
    location = / { return 301 /es/; }

    # --- Migración WordPress → protección SEO ---
    # 301 permanentes a los equivalentes reales del nuevo sitio.
    location = /blog/         { return 301 /es/blog/; }
    location = /news/         { return 301 /es/blog/; }
    location = /contact-us/   { return 301 /es/contacto/; }
    location = /services/     { return 301 /es/servicios/; }
    location = /destinations/ { return 301 /es/destinos/; }
    location = /faqs/         { return 301 /es/recursos/preguntas-frecuentes/; }
    location = /team/         { return 301 /es/nosotros/; }
    location = /gallery/      { return 301 /es/nosotros/; }
    location = /testimonial/  { return 301 /es/testimonios/; }

    # 410 Gone: contenido demo del template Jetly (jets, tienda WooCommerce,
    # plantillas). Le indica a Google que elimine estas URLs del índice.
    location ~* ^/(producto|categoria-producto|category|tag|author|header|footer|megamenu|business-charter|private-charter|jet-rentals|music-tours|sports-teams|high-profile-people|home-one|home-two|home-three|home-four|home-rtl|onepage-|jetly-|few-reasons|flights-precautionary|destination-details|gallery-carousel|news-carousel|service-carousel|team-carousel|testimonials-carousel|sample-page|hello-world|tienda|carrito|finalizar-compra|mi-cuenta|lista-de-deseos|wishlist)(/|$) {
        return 410;
    }

    # Assets con hash: caché inmutable de 1 año.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Páginas estáticas de Astro (carpeta/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
